[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microscopy-count-qc"
version = "0.1.0"
description = "Reproducible nuclei counting and human review on BBBC039"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "scikit-image==0.24.0", "pillow==11.0.0", "tifffile==2024.9.20"]

[project.optional-dependencies]
model = ["cellpose==3.1.1.1", "torch==2.5.1"]
dev = ["pytest==8.3.4", "ruff==0.8.6"]

[project.scripts]
microscopy-qc = "microscopy_qc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microscopy_qc"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
